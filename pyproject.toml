[project]
name = "content"
version = "0.1.0"
description = "Документы, файлы и PDF AIIP"
requires-python = ">=3.14"
dependencies = [
    "aiip-kit @ https://github.com/AI-Incident-Investigation-Platform/aiip-kit/archive/refs/tags/v0.1.0.tar.gz",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "boto3>=1.35",
    "fastapi>=0.143.3",
    "httpx>=0.28",
    "opentelemetry-exporter-otlp-proto-http>=1.40",
    "opentelemetry-instrumentation-fastapi>=0.60b0",
    "opentelemetry-instrumentation-httpx>=0.60b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b0",
    "opentelemetry-sdk>=1.40",
    "pydantic-settings>=2.16.0",
    "prometheus-client>=0.26",
    "reportlab>=4.2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.54.0",
    "redis>=7.0",
]

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = ["case(id): сценарий из tests/scenarios.toml"]

[tool.ruff]
line-length = 100
target-version = "py314"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
