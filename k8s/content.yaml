apiVersion: apps/v1
kind: Deployment
metadata:
  name: content
spec:
  replicas: 2
  selector:
    matchLabels: {app: content}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: content}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8008"
        prometheus.io/path: /metrics
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: content
          image: aiip-content:latest
          envFrom:
            - secretRef: {name: content}
          ports:
            - {name: http, containerPort: 8008}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 160Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: content
spec:
  selector: {app: content}
  ports:
    - {name: http, port: 8008, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: content-ratelimit
spec:
  rateLimit: {average: 50, burst: 100, period: 1s}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: content
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: apps-content-ratelimit@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/documents
            pathType: Prefix
            backend: {service: {name: content, port: {number: 8008}}}
          - path: /api/v1/uploads
            pathType: Prefix
            backend: {service: {name: content, port: {number: 8008}}}
          - path: /api/v1/files
            pathType: Prefix
            backend: {service: {name: content, port: {number: 8008}}}
          - path: /api/v1/attachments
            pathType: Prefix
            backend: {service: {name: content, port: {number: 8008}}}
          - path: /api/v1/exports
            pathType: Prefix
            backend: {service: {name: content, port: {number: 8008}}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: content-project-routes
spec:
  entryPoints: [web]
  routes:
    - match: PathRegexp(`^/api/v1/projects/[^/]+/(documents|exports)(/.*)?$`)
      kind: Rule
      priority: 100
      middlewares:
        - name: content-ratelimit
      services:
        - name: content
          port: 8008
